spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
    locations: classpath:db/migration/flyway/schema,classpath:db/migration/flyway/jdd/reference

# Doc OpenAPI / Swagger UI : utile en local, inutile en prod où elle
# cartographierait l'API pour un attaquant.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

logging:
  level:
    org.flywaydb: INFO
