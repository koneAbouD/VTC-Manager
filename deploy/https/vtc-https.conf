# =============================================================================
# nginx (VPS) — HTTPS par nom de domaine
# À placer dans le dossier conf.d monté dans le conteneur nginx de l'infra.
# Certificat Let's Encrypt (90 jours, un seul certificat pour les trois noms)
# délivré par certbot sur l'hôte : voir deploy/https/PROCEDURE.md.
#
# ⚠ « tmk.example » est un domaine factice : le remplacer partout par le vrai
#   (sed -i 's/tmk\.example/votre-domaine.ci/g' vtc-https.conf).
# ⚠ Les noms d'upstream (vtc-manager-backend:8081, minio:9000, grafana:3000)
#   doivent correspondre aux conteneurs du VPS : vérifier avec
#   `docker ps --format '{{.Names}}'` et adapter avant de recharger.
# =============================================================================

# --- Port 80 : défi ACME + redirection vers HTTPS ---------------------------
server {
    listen 80 default_server;
    server_name _;

    # Défi HTTP-01 de Let's Encrypt (certbot --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Paramètres TLS communs aux blocs 443 -----------------------------------
ssl_certificate     /etc/letsencrypt/live/vtc/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/vtc/privkey.pem;
ssl_protocols       TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# Connexion / OTP WhatsApp : 10 tentatives par minute et par IP, au-delà 429.
# Volontairement large : sur réseau mobile, de nombreux téléphones sortent par
# la même IP d'opérateur (CGNAT). Le refresh de jeton n'est pas limité.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

# --- 443 par défaut : nom inconnu ou accès par l'IP → connexion refusée ------
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# --- api.tmk.example : API des deux applications mobiles ---------------------
server {
    listen 443 ssl;
    http2 on;
    server_name api.tmk.example;

    # HSTS volontairement court tant que la bascule n'est pas validée ;
    # passer à 31536000 une fois tout stable (PROCEDURE.md §9).
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Pièces jointes : au-dessus de la limite backend (10 Mo) pour que ce soit
    # le backend, et non nginx, qui renvoie le refus explicite.
    client_max_body_size 25m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port  443;

    location ~ ^/api/auth/(login|register|forgot-password|otp/|chauffeur/login) {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://vtc-manager-backend:8081;   # URI d'origine conservée
    }

    location /api/ {
        proxy_pass http://vtc-manager-backend:8081/api/;
        proxy_read_timeout 120s;   # imports OCR / génération PDF
    }

    # Rien d'autre n'est publié (ni /actuator, ni /swagger-ui).
    location / {
        return 404;
    }
}

# --- s3.tmk.example : API S3 de MinIO, pour les URLs signées -----------------
# Le backend signe les URLs de photos/documents pour cet hôte
# (MINIO_PUBLIC_ENDPOINT=https://s3.tmk.example). La signature couvrant l'hôte,
# le Host d'origine doit être transmis tel quel à MinIO.
server {
    listen 443 ssl;
    http2 on;
    server_name s3.tmk.example;

    add_header Strict-Transport-Security "max-age=86400" always;

    client_max_body_size 25m;
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        proxy_pass http://minio:9000;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}

# --- grafana.tmk.example (GF_SERVER_ROOT_URL=https://grafana.tmk.example/) ---
server {
    listen 443 ssl;
    http2 on;
    server_name grafana.tmk.example;

    add_header Strict-Transport-Security "max-age=86400" always;

    location / {
        proxy_pass http://grafana:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;   # live Grafana (websocket)
        proxy_set_header Connection $http_connection;
    }
}

# Console MinIO (9001), Keycloak (8080), Prometheus (9090) : volontairement non
# publiés. Y accéder par tunnel SSH (PROCEDURE.md §8).

# --- Port 5001 : ancien point d'entrée HTTP des apps mobiles -----------------
# Conservé le temps que toutes les installations passent à la version HTTPS,
# puis à supprimer (et retirer le port 5001 du compose) : PROCEDURE.md §9.
server {
    listen 5001;
    server_name _;
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://vtc-manager-backend:8081/api/;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
