# =============================================================================
# nginx (VPS) — HTTPS sur l'adresse IP 155.133.27.101
# À placer dans le dossier conf.d monté dans le conteneur nginx de l'infra.
# Certificat Let's Encrypt « IP » (profil shortlived, 6 jours) délivré par
# certbot sur l'hôte : voir deploy/https/PROCEDURE.md.
#
# ⚠ Les noms d'upstream (vtc-manager-backend:8081, keycloak:8080, grafana:3000,
#   minio:9001…) doivent correspondre aux noms de conteneurs du VPS : vérifier
#   avec `docker ps --format '{{.Names}}'` et adapter avant de recharger.
# =============================================================================

# --- Port 80 : défi ACME + redirection vers HTTPS ---------------------------
server {
    listen 80 default_server;
    server_name _;

    # Défi HTTP-01 de Let's Encrypt (certbot --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Port 443 : toutes les applications ---------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/155.133.27.101/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/155.133.27.101/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS volontairement court tant que la bascule n'est pas validée ;
    # passer à 31536000 une fois tout stable.
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # Pièces jointes : au-dessus de la limite backend (10 Mo) pour que ce soit
    # le backend, et non nginx, qui renvoie le refus explicite.
    client_max_body_size 25m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port  443;

    # VTC Manager — API des deux apps mobiles
    location /api/ {
        proxy_pass http://vtc-manager-backend:8081/api/;
        proxy_read_timeout 120s;   # imports OCR / génération PDF
    }

    # Keycloak (console d'admin) — voir PROCEDURE.md §5 avant d'activer
    # location /auth/ {
    #     proxy_pass http://keycloak:8080/;
    # }

    # Grafana (définir GF_SERVER_ROOT_URL=https://155.133.27.101/grafana/
    #          et GF_SERVER_SERVE_FROM_SUB_PATH=true)
    location /grafana/ {
        proxy_pass http://grafana:3000/;
    }

    # Console MinIO (MINIO_BROWSER_REDIRECT_URL=https://155.133.27.101/minio/)
    location /minio/ {
        proxy_pass http://minio:9001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# --- Port 5001 : ancien point d'entrée HTTP des apps mobiles -----------------
# Conservé le temps que toutes les installations passent à la version HTTPS,
# puis à supprimer (et retirer le port 5001 du compose).
server {
    listen 5001;
    server_name _;
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://vtc-manager-backend:8081/api/;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
