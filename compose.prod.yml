# Docker Compose de PRODUCTION (VPS)
# L'infrastructure (PostgreSQL, Keycloak, Redis, MinIO) est déjà en place.
# Ce fichier n'orchestre que l'image du backend et la raccorde à l'infra existante.
#
# Lancement :  docker compose -f compose.prod.yml --env-file .env up -d --build
# Mise à jour : docker compose -f compose.prod.yml --env-file .env up -d --build backend
#
# NB : Redis n'est pas une dépendance du backend (absent du pom.xml) — non configuré ici.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: tmk/vtc-manager-backend:${APP_VERSION:-latest}
    container_name: vtc-manager-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod

      # --- Base de données (infra existante) ---
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      # --- Keycloak (infra existante) ---
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_JWK_URI: ${KEYCLOAK_JWK_URI}
      KEYCLOAK_AUTH_SERVER_URL: ${KEYCLOAK_AUTH_SERVER_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}

      # --- MinIO (infra existante) ---
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-vtc-documents}
      # Adresse publique HTTPS de MinIO : les URLs de photos/documents remises
      # aux apps sont signées pour elle (https://s3.<domaine>, voir deploy/https).
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-}

      # Les apps natives n'envoient pas d'Origin : vide = aucun navigateur autorisé.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}

      # --- OCR des quittances (service Tesseract ci-dessous) ---
      OCR_URL: ${OCR_URL:-http://tesseract:8884}

      # --- Notifications push (Firebase Cloud Messaging) ---
      # FCM_CREDENTIALS_B64 : clé du compte de service Firebase encodée en
      # base64 (base64 -w0 cle-service-firebase.json). Encodée plutôt que
      # montée en volume pour rester dans le même modèle de secrets que le
      # reste du service.
      PUSH_ENABLED: ${PUSH_ENABLED:-false}
      FCM_CREDENTIALS_B64: ${FCM_CREDENTIALS_B64:-}
    # Lié à la boucle locale : l'accès public passe uniquement par nginx (HTTPS),
    # qui joint le backend par le réseau infra. Un port publié sur 0.0.0.0
    # contournerait le pare-feu (Docker écrit ses propres règles iptables).
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:8081"
    networks:
      - infra
    depends_on:
      - tesseract
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Service OCR (Tesseract, psm 6) : lit les relevés et quittances scannés /
  # photographiés. Le backend l'appelle sur http://tesseract:8884 (réseau infra).
  # Image construite et poussée sur GHCR par le workflow .github/workflows/ocr-docker.yml
  # (source : dossier ocr/). Déploiement : `docker compose -f compose.prod.yml pull tesseract && up -d`.
  tesseract:
    image: ${OCR_IMAGE:-ghcr.io/koneaboud/vtc-manager-ocr:latest}
    container_name: tesseract
    restart: unless-stopped
    networks:
      - infra
    # Redéclaré ici pour ne pas dépendre de la version de l'image tirée : une
    # ancienne image visait « localhost », que le wget de busybox résout en ::1
    # alors que gunicorn n'écoute qu'en IPv4 → unhealthy permanent (faux négatif)
    # et redémarrages en boucle par le watchdog. Toujours 127.0.0.1.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8884/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: ${OCR_MEM_LIMIT:-512m}

# Réseau de l'infra déjà existante sur le VPS.
# Récupère le nom exact via : docker network ls
# puis renseigne INFRA_NETWORK dans .env (ex: infra_default).
networks:
  infra:
    external: true
    name: ${INFRA_NETWORK:-infra}
