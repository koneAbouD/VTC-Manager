name: tmk_cache
description: "Cache local partagé par les applications TMK : dernières réponses de l'API servies quand le réseau manque, et cache disque des images."
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Base SQLite des réponses (isolate dédié sur mobile). Socle de la
  # consultation hors ligne : les tables typées viendront s'y ajouter.
  drift: ^2.26.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.0

  # AES-GCM : les réponses sont chiffrées avant d'être écrites sur le disque.
  cryptography: ^2.7.0

  # Clé de chiffrement du cache (Keystore Android / Keychain iOS).
  flutter_secure_storage: ^9.2.2

  # Images : cache disque, servi hors ligne.
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
